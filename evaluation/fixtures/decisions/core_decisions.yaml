# #0016 rerank ablation 용 mock 결정 이력 (evaluation/datasets/core.yaml 대응)
# schema_version: "1"
#
# 실제 승인 이력이 아니다 — rerank on/off 차이를 재현 가능하게 만들기 위한 합성
# fixture 다. article_id 는 벤치마크 runner 가 만드는 "{law_name}:{article}" 형식과
# 정확히 같아야 한다(다르면 문맥 게이팅으로 전부 UNRELATED 가 된다).
#
# 정답 파일에만 유리하게 짜지 않는다 — boost 1건, penalty 1건, 무관 조문 1건,
# stale 1건, compatible type 1건을 함께 둬서 게이팅과 stale 미강제도 관측된다.

decisions:

  # (1) 정답 파일에 대한 exact verified — boost 가 정답을 끌어올리는지.
  #     tax_child_credit_value_001 (소득세법 제59조의2 / value_change)
  - path: "tax/TaxConstants.java"
    article_id: "소득세법:제59조의2"
    change_type: "value_change"
    state: "verified"
    reason_code: "confirmed_by_owner"

  # (2) 같은 개정의 오답 파일에 대한 exact rejected — penalty 가 오답을 끌어내리는지.
  - path: "salary/HrConstants.java"
    article_id: "소득세법:제59조의2"
    change_type: "value_change"
    state: "rejected"
    reason_code: "wrong_module"
    rejection_count: 1

  # (3) 데이터셋의 어느 케이스와도 조문이 다른 verified 이력 — 문맥 게이팅(§11)이
  #     무관 boost 를 막는지. 어떤 쿼리에서도 delta 0 이어야 한다.
  - path: "salary/HrConstants.java"
    article_id: "소득세법:제52조"
    change_type: "value_change"
    state: "verified"
    reason_code: "exact_constant_confirmed"

  # (4) 정답 파일에 붙은 stale 이력 — stale 은 boost 를 잃고 penalty 를 받는다.
  #     검증 이력이 있어도 강제 정답 처리되지 않는지 확인용(수용 기준).
  #     tax_year_end_deadline_date_001 (소득세법 제140조 / date_change)
  - path: "tax/TaxConstants.java"
    article_id: "소득세법:제140조"
    change_type: "date_change"
    state: "stale"
    reason_code: "content_changed"

  # (5) 같은 조문 + 호환 change_type(value_change ↔ rate_change) — 중간 boost.
  #     tax_capital_gains_rate_001 (소득세법 제104조 / rate_change) 쿼리에 대응.
  - path: "tax/TaxConstants.java"
    article_id: "소득세법:제104조"
    change_type: "value_change"
    state: "verified"
    reason_code: "matched_historical_change"
    historical_match: true
