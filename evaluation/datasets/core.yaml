  - schema_version: "1"
    case_id: "tax_child_credit_value_001"
    title: "자녀세액공제 금액 변경"
    domain: "tax"
    tags: ["value_change", "java", "tax_credit"]

    law:
      law_name: "소득세법"
      tier: "law"
      article: "제59조의2"
      before_text: "자녀 1명당 연 15만원을 공제한다."
      after_text: "자녀 1명당 연 25만원을 공제한다."
      effective_date: "2026-01-01"

    expected:
      change_type: "value_change"
      automation_decision: "draft_allowed"
      retrieval:
        relevant_files:
          - "tax/TaxConstants.java"
        primary_files:
          - "tax/TaxConstants.java"
        relevant_symbols:
          - "TaxConstants.CHILD_TAX_CREDIT"
      patch:
        expected_replacements:
          - path: "tax/TaxConstants.java"
            before: "150000L"
            after: "250000L"
            match_mode: "exact"
        forbidden_files: []
        require_git_apply: false
        require_golden_pass: false

    repository:
      fixture_type: "directory"
      path: "evaluation/fixtures/repositories/mock_tax"

    execution:
      evaluate_classification: true
      evaluate_retrieval: true
      evaluate_patch: true
      top_k: [1, 3, 5, 10]
      timeout_seconds: 600

    metadata:
      source: "synthetic"
      reviewed: true

